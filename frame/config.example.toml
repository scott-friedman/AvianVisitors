# AvianVisitors e-ink frame (Inky Impression 7.3", 800x480, 7-colour).
# Copy to config.toml and edit. config.toml is gitignored. Nothing here is
# secret unless your whole site is behind basic-auth (see the bottom).

# avian-worker base. The Pi reads the recent API here to decide when a refresh
# is worth it, and fetches the rendered frame from /frame.png. All outbound —
# a Pi Zero 2 W at a relative's house never serves anything.
base_url = "https://avian-worker.s-friedman.workers.dev"

hours = 24             # FALLBACK change-detection window only — normally the shared
                       # window comes from /api/frame-config (the site's 1H–ALL picker)
                       # and this is ignored; used only when that endpoint is unreachable

# The ready-made 800x480 PNG, rendered off-Pi by avian-worker's /frame.png
# (Cloudflare Browser Rendering), gated by its FRAME_KEY secret — put that key
# after k=. A Pi Zero 2 W has no browser, so it always fetches; never shoots.
image_url = "https://avian-worker.s-friedman.workers.dev/frame.png?k=YOUR_FRAME_KEY"
# Or read a PNG a sibling process drops next to us:
# image = "~/.birdframe/frame.png"

# Panel.
rotate = 0             # 0 = native landscape; 180 if the frame hangs upside down
border = 0             # inset the image this many px on every edge: a white margin so a
                       # picture-frame bezel that overlaps the panel edge can't clip the art.
                       # 0 = full-bleed. ~20 (~4 mm) is a typical bezel; tune with --border.
saturation = 0.7       # Inky colour saturation, 0 to 1
# panel = "inky_ac073tc1"   # force the 7.3" driver module if inky.auto() ever fails

# Refresh cadence. The panel refreshes only when the species set or a count
# bracket changes, plus a daily heal. Quiet hours are off so nocturnal
# detections still show; set quiet_start/quiet_end to a window to mute overnight.
quiet_start = 0        # 0/0 = always refresh on change; e.g. 22 and 6 mutes 22:00-06:00
quiet_end = 0
heal_hours = 24        # force a refresh at least this often

# Paths.
state = "~/.birdframe/state.json"
timeout = 45

# Only if your WHOLE site is behind basic-auth. The AvianVisitors default leaves
# the collage and detection API public, so usually leave these out.
# basic_user = "monalisa"
# basic_pass = "..."
