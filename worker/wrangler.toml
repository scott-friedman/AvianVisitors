name = "avian-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]  # @cloudflare/puppeteer needs node:buffer (for /frame.png)
workers_dev = true          # start on avian-worker.<subdomain>.workers.dev (free)
preview_urls = false

# D1: detection rows. `database_id` is a placeholder until
# `wrangler d1 create avian-detections` (or the Cloudflare MCP) returns the real
# UUID — paste it here. Local dev (`--local`) ignores the id and keys off the name.
[[d1_databases]]
binding = "DB"
database_name = "avian-detections"
database_id = "9145557b-fbe3-43f5-baf8-ff0bb14c1a3f"

# Browser Rendering: /frame.png launches a headless browser to screenshot the
# Pages collage at 800x480 for the e-ink panel. Free plan = 10 min browser/day,
# so the Worker caches by signature (D1 frame_cache) and re-renders only on change.
[browser]
binding = "BROWSER"

# R2: per-detection bird-call clips (~45 KB mp3 each). The Pi POSTs bytes to
# /api/clip (secret-gated); the public site plays them via /api/recording.
# A 7-day object-lifecycle rule (set on the bucket, NOT in this file; prefix-
# scoped to clips/) deletes clips a week after upload → ~440 MB steady-state.
# Each species' first 25 clips are also copied to rare/ (no lifecycle rule →
# kept forever; ≤1.1 MB per species). See AUDIO-FIX-PLAN.md + CLIP-RETENTION-PLAN.md.
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "avian-clips"

[vars]
# Local timezone for "today"/daily buckets and displayed times. TZ_NAME (IANA
# zone) is authoritative and DST-correct (computed per-hour via Intl in the
# Worker); TZ_OFFSET_HOURS is only the fallback if TZ_NAME is unset or Intl
# can't resolve it. Rolling windows (recent/last_hour/week) are computed in UTC
# seconds and are unaffected.
TZ_NAME = "America/New_York"  # Sudbury, MA
TZ_OFFSET_HOURS = "-4"        # fallback only (EDT; would read -5-in-winter wrong — TZ_NAME avoids that)

# Site coordinates for the Day Dial's sunrise/sunset band (/api/hourly → sunArc).
# Sudbury, MA. East-positive longitude. Unset/invalid → sun:null → band omitted.
SITE_LAT = "42.385"
SITE_LON = "-71.417"

# The page Browser Rendering screenshots for /frame.png. ?frame=1 strips chrome
# to a pure-white, animation-free collage (see avian/frontend/index.html).
# 2026-07-02: host moved — birds-origin.indianridgeroad.com is the custom
# domain on the `avianvisitors` Pages project (the site's real home; the old
# barrysbirds.pages.dev is a 301 stub to indianridgeroad.com/birds/ and must
# NOT be fetched here — redirects would add a hop or loop via the ridge proxy).
FRAME_URL = "https://birds-origin.indianridgeroad.com/?frame=1"

# Pages origin the Worker reads back for GET /api/coverage — the art-manifest.json
# (illustration slugs) and signatures.json (song-signature species) it diffs the
# D1 life list against. Same host as FRAME_URL, sans the ?frame=1 query.
PAGES_BASE = "https://birds-origin.indianridgeroad.com"

# Liveness threshold for GET /api/status. The Pi pings POST /api/heartbeat every
# 15 min, so 2700 s (45 min) = 3 missed pings before /api/status returns 503.
# Point an external uptime monitor (UptimeRobot, etc.) at /api/status to get alerted.
HEARTBEAT_MAX_AGE_SECONDS = "2700"

# Mojo the dog-bird (easter egg): daytime-only "detections" of the family dog,
# every 30 min with random skips — 10:00–23:30 UTC = 6:00–19:30 ET. Quiet at
# night (believable, and no nighttime /frame.png re-renders). Remove this block
# together with the MOJO section + scheduled() in src/index.js to retire him.
[triggers]
crons = ["*/30 10-23 * * *"]

# NOTE: AVIAN_INGEST_SECRET and FRAME_KEY are SECRETS, not vars. Set them with:
#   echo '<random>' | wrangler secret put AVIAN_INGEST_SECRET   # gates POST /api/detection
#   echo '<random>' | wrangler secret put FRAME_KEY             # gates GET /frame.png?k=...
# For local dev they live in worker/.dev.vars (gitignored).
