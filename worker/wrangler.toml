name = "avian-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true          # start on avian-worker.<subdomain>.workers.dev (free)
preview_urls = false

# D1: detection rows. `database_id` is a placeholder until
# `wrangler d1 create avian-detections` (or the Cloudflare MCP) returns the real
# UUID — paste it here. Local dev (`--local`) ignores the id and keys off the name.
[[d1_databases]]
binding = "DB"
database_name = "avian-detections"
database_id = "9145557b-fbe3-43f5-baf8-ff0bb14c1a3f"

[vars]
# Local-day offset (hours from UTC) for the "today"/daily buckets, e.g. "-4" for
# US Eastern (EDT). Rolling windows (recent/last_hour/week) are computed in UTC
# seconds and are unaffected. Default UTC.
TZ_OFFSET_HOURS = "0"

# NOTE: AVIAN_INGEST_SECRET is a SECRET, not a var. Set it with:
#   echo '<random>' | wrangler secret put AVIAN_INGEST_SECRET
# For local dev it lives in worker/.dev.vars (gitignored).
