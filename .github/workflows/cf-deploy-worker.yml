# Deploy avian-worker on worker/ changes (PLAN.md item 4; the foobos pattern).
#
# GATED on the CLOUDFLARE_API_TOKEN repo secret: until it exists the job
# no-ops with a notice instead of failing red (the 2026-06 predecessors were
# deleted precisely because the secret never got set). To enable:
#   1. Create an API token scoped to bird's resources ONLY (Workers Scripts:
#      Edit + D1: Edit on avian-detections) — never a foobos-capable token.
#   2. gh secret set CLOUDFLARE_API_TOKEN
# Migrations apply before the deploy (they're written to be safe under the
# old code; new code may REQUIRE them — e.g. 0006's per-window frame_cache).
name: Deploy worker

on:
  push:
    branches: [avian-visitors]
    paths: ['worker/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency: cf-deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Gate on the deploy token
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping deploy (see this workflow's header to enable)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'
        working-directory: worker
      - run: npx wrangler d1 migrations apply avian-detections --remote
        if: steps.gate.outputs.enabled == 'true'
        working-directory: worker
      - run: npx wrangler deploy
        if: steps.gate.outputs.enabled == 'true'
        working-directory: worker
