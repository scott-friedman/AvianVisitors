name: Deploy collage to Cloudflare Pages

# Static AvianVisitors collage (avianvisitors.pages.dev). Data is served live by
# avian-worker at runtime, so there is no data-generation step — just assemble
# _site from the frontend shell + bundled illustrations and deploy.
#
# Requires repo secrets (scoped to bird's Cloudflare resources only):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
  push:
    branches: [avian-visitors]
    paths:
      - 'avian/frontend/**'
      - 'avian/assets/illustrations/**'
      - 'avian/assets/cutouts/**'
      - 'avian/build-site.sh'
      - '.github/workflows/cf-deploy-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble _site
        run: bash avian/build-site.sh

      - name: Install Wrangler
        run: npm install -g wrangler@4.63.0

      - name: Deploy to Cloudflare Pages
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COMMIT_MSG=$(git log -1 --format='%s' | tr -cd '[:print:][:space:]' | head -c 200)
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            if wrangler pages deploy _site --project-name=avianvisitors \
                 --branch=avian-visitors --commit-dirty=true --commit-message="$COMMIT_MSG"; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "Deploy failed after 3 attempts"; exit 1
